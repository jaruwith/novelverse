name: Frontend PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the reviewed PR commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up pinned Node LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.0
          cache: npm

      - name: Reproducible install
        run: npm ci

      - name: Workflow static validation
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"

      - name: Deployed Beta E2E configuration safety
        run: |
          node scripts/test-deployed-beta.mjs \
            --base-url https://beta.example.invalid \
            --approved-hostname beta.example.invalid \
            --environment Beta \
            --coordinated-release v1.4.0-alpha.2 \
            --validate-config-only

      - name: Tests, static checks, and production build
        run: |
          npm test
          npm run lint
          npm run typecheck
          npm run build

      - name: Source dependency vulnerability scans
        run: |
          npm audit
          npm audit --omit=dev

      - name: Artifact manifest contract tests
        shell: pwsh
        run: ./scripts/test-deployment-component-manifest.ps1

      - name: PR whitespace check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"
